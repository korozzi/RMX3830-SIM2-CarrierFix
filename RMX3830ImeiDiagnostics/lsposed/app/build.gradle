plugins { id 'com.android.application' }

android {
    namespace 'com.rmx3830.imeidiagnostics'
    compileSdk 35
    defaultConfig { applicationId 'com.rmx3830.imeidiagnostics'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { debug { minifyEnabled false }; release { minifyEnabled false } }
    packaging { resources { merges += ['META-INF/xposed/*'] } }
}

dependencies { compileOnly 'io.github.libxposed:api:101.0.0' }
