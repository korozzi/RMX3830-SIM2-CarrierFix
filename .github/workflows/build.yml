name: Build Magisk ZIP

on:
  push:
    branches: [ main ]
    paths:
      - 'module.prop'
      - 'action.sh'
      - 'README.md'
      - 'build.sh'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Validate ZIP
        run: |
          ZIP="$(find dist -maxdepth 1 -name 'RMX3830_NV_Backup_v*.zip' -print -quit)"
          test -n "$ZIP"
          unzip -t "$ZIP"
          unzip -l "$ZIP"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RMX3830-NV-Backup-v1.0.0
          path: dist/RMX3830_NV_Backup_v*.zip
          if-no-files-found: error
