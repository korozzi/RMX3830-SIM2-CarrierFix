name: Build Magisk ZIP

on:
  push:
    branches: [ main ]
    paths:
      - 'module.prop'
      - 'post-fs-data.sh'
      - 'service.sh'
      - 'uninstall.sh'
      - 'build.sh'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Validate ZIP
        run: |
          ZIP="$(find dist -maxdepth 1 -name 'RMX3830_SIM2_CarrierFix_v*.zip' -print -quit)"
          test -n "$ZIP"
          unzip -t "$ZIP"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RMX3830-SIM2-CarrierFix-v2
          path: dist/RMX3830_SIM2_CarrierFix_v*.zip
          if-no-files-found: error
