name: Build RMX3830 IMEI Probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'RMX3830ImeiProbe/**'
      - '.github/workflows/build-imei-probe.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: RMX3830ImeiProbe
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp RMX3830ImeiProbe/app/build/outputs/apk/debug/app-debug.apk dist/RMX3830ImeiProbe-v1.0.0-debug.apk
          (cd RMX3830ImeiProbe && zip -qr ../dist/RMX3830ImeiProbe-v1.0.0-source.zip .)

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: RMX3830ImeiProbe-v1.0.0
          path: dist/*
          retention-days: 30
